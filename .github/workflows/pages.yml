# Publishes the game on every push to master: builds it and puts the built files in
# dagny/ of the public site repo Vitknut/vitknut.github.io, which GitHub Pages serves
# at https://vitknut.github.io/dagny/. The source (this repo) can stay private.
#
# One-time setup (docs/publicering.md): a fine-grained token with "Contents: Read and
# write" on Vitknut/vitknut.github.io, stored here as the secret SITE_TOKEN.
name: Publicera på vitknut.github.io

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Hämta sajtens repo
        uses: actions/checkout@v4
        with:
          repository: Vitknut/vitknut.github.io
          ref: main
          token: ${{ secrets.SITE_TOKEN }}
          path: site

      - name: Lägg det byggda spelet i dagny/
        run: |
          rm -rf site/dagny
          mkdir -p site/dagny
          cp -R dist/. site/dagny/

      - name: Checka in och pusha
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dagny
          if git diff --cached --quiet; then
            echo "Inget nytt att publicera."
            exit 0
          fi
          git commit -m "Publicera Dagnys äventyr (${GITHUB_SHA::7})"
          git push origin main
