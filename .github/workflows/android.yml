# Builds the Android app bundle (.aab) for Google Play.
# Run it from the Actions tab ("Run workflow"). The signed bundle is attached
# to the run as an artifact. Signing secrets: see android/README.md.
name: Bygg Android-app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Hämta signeringsnyckeln
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 saknas – bygger ett osignerat paket som inte kan laddas upp till Play."
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "DAGNY_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Bygg app bundle
        env:
          DAGNY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAGNY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DAGNY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # The run number becomes the versionCode, so every build can be uploaded.
        run: ./gradlew --no-daemon bundleRelease -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: dagny-${{ github.run_number }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
